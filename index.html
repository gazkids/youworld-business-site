    <style>
        /* ── Design Tokens ─────────────────────────────── */
        :root {
            --paper:  #FAFAF7;
            --white:  #FFFFFF;
            --ink:    #0C0C0E;
            --navy:   #0F2056;
            --gold:   #C4A26A;
            --mist:   #F2EEE8;
            --border: #E0DAD2;
            --mid:    #71717A;
            --light:  #A8A29E;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--paper);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── Typography ────────────────────────────────── */
        .t-display {
            font-size: clamp(3rem, 7.5vw, 6.5rem);
            font-weight: 900;
            line-height: 1.08;
            letter-spacing: -0.03em;
        }
        .t-h2 {
            font-size: clamp(1.875rem, 3.5vw, 3rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.025em;
        }
        .t-h3 {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }
        .t-body {
            font-size: 1.0625rem;
            line-height: 1.8;
            font-weight: 400;
        }
        .t-small {
            font-size: 0.9375rem;
            line-height: 1.65;
        }

        /* ── Eyebrow Labels ────────────────────────────── */
        .eyebrow {
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold);
            font-family: 'Inter', monospace;
        }
        .eyebrow-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(196,162,106,0.13);
            border: 1px solid rgba(196,162,106,0.4);
            color: var(--navy);
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: 'Inter', monospace;
        }
        .eyebrow-pill::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            flex-shrink: 0;
        }

        /* ── Signature: Gold Rule ──────────────────────── */
        .gold-rule {
            width: 36px;
            height: 2.5px;
            background: var(--gold);
            border-radius: 2px;
            display: block;
        }

        /* ── Signature: Gold Underline on "主導権" ─────── */
        .key-word {
            position: relative;
            display: inline-block;
            color: var(--navy);
        }
        .key-word::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0.06em;
            height: 4px;
            background: var(--gold);
            border-radius: 2px;
            opacity: 0.85;
        }

        /* ── Buttons ───────────────────────────────────── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--navy);
            color: #fff;
            padding: 0.9rem 1.875rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9375rem;
            text-decoration: none;
            transition: background 0.22s, box-shadow 0.22s, transform 0.22s;
            letter-spacing: -0.005em;
        }
        .btn-primary:hover {
            background: #1a3470;
            box-shadow: 0 10px 28px rgba(15, 32, 86, 0.22);
            transform: translateY(-1px);
        }
        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            color: var(--ink);
            padding: 0.875rem 1.875rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9375rem;
            text-decoration: none;
            border: 1.5px solid var(--border);
            transition: border-color 0.22s, background 0.22s;
        }
        .btn-ghost:hover {
            border-color: var(--gold);
            background: rgba(196,162,106,0.04);
        }

        /* ── Cards ─────────────────────────────────────── */
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .card:hover {
            border-color: rgba(196,162,106,0.45);
            box-shadow: 0 12px 32px rgba(15, 32, 86, 0.07);
        }

        /* ── Navigation ────────────────────────────────── */
        .nav-link {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--mid);
            text-decoration: none;
            transition: color 0.18s;
            letter-spacing: 0.01em;
        }
        .nav-link:hover { color: var(--navy); }

        /* ── Section backgrounds ───────────────────────── */
        .bg-paper { background-color: var(--paper); }
        .bg-mist  { background-color: var(--mist); }
        .bg-white { background-color: var(--white); }
        .bg-navy  { background-color: var(--navy); }

        /* ── Audience list items ────────────────────────── */
        .audience-item {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            padding: 1.5rem 0.5rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .audience-item:hover {
            background: rgba(196,162,106,0.05);
        }
        .audience-num {
            font-family: 'Inter', monospace;
            font-size: 1.625rem;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: -0.02em;
            margin-top: -2px;
            flex-shrink: 0;
            width: 2.75rem;
            opacity: 0.85;
        }

        /* ── Service rows ───────────────────────────────── */
        .service-item {
            padding: 1.875rem 0;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 2rem;
            align-items: start;
        }
        @media (max-width: 768px) {
            .service-item { grid-template-columns: 1fr; gap: 0.75rem; }
        }

        /* ── Comparison table ───────────────────────────── */
        .compare-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        /* ── AI Coach Finder chat bubbles ────────────────── */
        .ai-chat-bubble {
            max-width: 85%;
            padding: 0.75rem 1.05rem;
            border-radius: 14px;
            font-size: 0.9375rem;
            line-height: 1.65;
            margin-bottom: 0.75rem;
            white-space: pre-wrap;
        }
        .ai-chat-bubble--bot {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--ink);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .ai-chat-bubble--user {
            background: var(--navy);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .compare-table th, .compare-table td {
            padding: 1.15rem 1.375rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9375rem;
        }
        .compare-table th {
            font-weight: 700;
            font-size: 0.8125rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--mid);
            background: var(--mist);
        }
        .compare-table td:first-child { font-weight: 600; color: var(--ink); }
        .compare-table td:not(:first-child) { color: var(--mid); text-align: center; }
        .compare-table .yw-col { background: rgba(15,32,86,0.03); font-weight: 700 !important; color: var(--navy) !important; }
        .compare-table th.yw-col { background: var(--navy); color: #fff !important; }
        .compare-table tr:last-child td { border-bottom: none; }

        /* ── Hero ambient bg ────────────────────────────── */
        .hero-ambient {
            position: absolute;
            top: 0; right: 0;
            width: 55%;
            height: 100%;
            background: linear-gradient(135deg, transparent 40%, var(--mist) 100%);
            pointer-events: none;
        }

        /* ── Scroll indicator ───────────────────────────── */
        @keyframes scrollPulse {
            0%, 100% { transform: scaleY(0.5); opacity: 0.3; }
            50%       { transform: scaleY(1);   opacity: 0.7; }
        }
        .scroll-line {
            width: 1px;
            height: 48px;
            background: var(--ink);
            transform-origin: top;
            animation: scrollPulse 1.8s ease-in-out infinite;
        }

        /* ── Fade-up reveal ─────────────────────────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fu  { animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .fu1 { animation-delay: 0.08s; }
        .fu2 { animation-delay: 0.18s; }
        .fu3 { animation-delay: 0.28s; }
        .fu4 { animation-delay: 0.38s; }

        /* ── Why-Human highlight box ─────────────────────── */
        .why-box {
            border-left: 3px solid var(--gold);
            padding: 1rem 1.25rem;
            background: rgba(196,162,106,0.05);
            border-radius: 0 10px 10px 0;
        }

        /* ── Profile photo placeholder ──────────────────── */
        .photo-placeholder {
            background: linear-gradient(145deg, #E8E3DB, #CEC8BF);
            display: flex; align-items: center; justify-content: center;
            color: #A8A29E; font-size: 0.6875rem; font-family: monospace;
        }
